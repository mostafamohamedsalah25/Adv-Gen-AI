<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chef Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6B7280; }

        /* Smooth markdown rendering */
        .chef-msg p { margin-bottom: 0.5rem; }
        .chef-msg p:last-child { margin-bottom: 0; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-4xl bg-gray-850 border border-gray-700 rounded-2xl shadow-2xl flex flex-col h-[90vh] overflow-hidden relative">

        <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 rounded-lg text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.792 0-5.484-.2-8.135-.587-1.718-.293-2.3-2.379-1.067-3.61L5 14.5" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">AI Chef Assistant</h1>
                    <p class="text-xs text-gray-400">Powered by LangGraph & Django</p>
                </div>
            </div>
        </header>

        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth flex flex-col">
            <div class="flex items-start gap-4 mr-auto max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0 mt-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-white">
                        <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                        <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
                    </svg>
                </div>
                <div class="bg-gray-800 border border-gray-700 text-gray-200 px-5 py-3 rounded-2xl rounded-tl-sm shadow-sm leading-relaxed text-sm">
                    Bonjour! I am your AI Chef. Tell me what ingredients you have in your kitchen, or upload a photo of your fridge, and let's cook something magnificent.
                </div>
            </div>
        </div>

        <div class="bg-gray-800 border-t border-gray-700 p-4">
            <div id="image-preview-badge" class="hidden items-center gap-2 mb-3 ml-2 text-xs font-medium text-emerald-400 bg-emerald-400/10 w-max px-3 py-1.5 rounded-full border border-emerald-400/20">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" />
                </svg>
                Image attached and ready to send
                <button id="clear-image-btn" class="ml-2 hover:text-emerald-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" /></svg>
                </button>
            </div>

            <div class="flex items-end gap-3 relative">
                <input type="file" id="image-upload" accept="image/*" class="hidden">

                <button onclick="document.getElementById('image-upload').click()" class="p-3 text-gray-400 hover:text-gray-100 hover:bg-gray-700 rounded-xl transition-all border border-transparent focus:outline-none focus:ring-2 focus:ring-gray-600 flex-shrink-0" title="Attach image">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
                    </svg>
                </button>

                <textarea id="user-input" rows="1" class="flex-1 bg-gray-900 border border-gray-700 text-gray-100 placeholder-gray-500 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none overflow-hidden text-sm" placeholder="Message your Chef..." style="min-height: 48px; max-height: 120px;"></textarea>

                <button id="send-btn" class="p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800 flex-shrink-0 shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const threadId = "session_" + Math.random().toString(36).substring(7);
        const chatBox = document.getElementById('chat-box');
        const inputField = document.getElementById('user-input');
        const fileInput = document.getElementById('image-upload');
        const previewBadge = document.getElementById('image-preview-badge');

        // Auto-resize textarea
        inputField.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Image Attachment Handling
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                previewBadge.classList.remove('hidden');
                previewBadge.classList.add('flex');
            }
        });

        document.getElementById('clear-image-btn').addEventListener('click', () => {
            fileInput.value = '';
            previewBadge.classList.add('hidden');
            previewBadge.classList.remove('flex');
        });

        async function sendMessage() {
            const message = inputField.value.trim();
            const file = fileInput.files[0];

            if (!message && !file) return;

            // Prepare base64 image if attached
            let base64Image = null;
            let displayMsg = message;

            if (file) {
                base64Image = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
                displayMsg = message ? message : "Attached an image.";
                displayMsg += ` <br><span class="text-xs text-blue-300 font-medium flex items-center gap-1 mt-2"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"/></svg> Image attached</span>`;
            }

            // Append User Message
            appendHTMLToChat('user', displayMsg);

            // Reset Inputs
            inputField.value = '';
            inputField.style.height = 'auto';
            fileInput.value = '';
            previewBadge.classList.add('hidden');
            previewBadge.classList.remove('flex');

            // Add Loading State
            const loadingId = 'loading_' + Date.now();
            appendHTMLToChat('chef', `<div class="flex items-center gap-2 text-gray-400">
                <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Chef is thinking...
            </div>`, loadingId);

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, image: base64Image, thread_id: threadId })
                });

                const data = await response.json();

                // Remove loading message
                document.getElementById(loadingId)?.remove();

                // Format standard reply (basic markdown line breaks)
                const formattedReply = data.reply.replace(/\n/g, '<br>');
                if (formattedReply) {
                    appendHTMLToChat('chef', `<div class="chef-msg text-sm leading-relaxed">${formattedReply}</div>`);
                }

                // Render JSON Recipe Card
                if (data.recipe_json && data.recipe_json.meals) {
                    data.recipe_json.meals.forEach((meal, index) => {
                        const ingredientsList = meal.ingredients.map(ing => {
                            const isMissing = ing.status.toLowerCase().includes('not');
                            const statusColor = isMissing ? 'text-rose-400 bg-rose-400/10 border-rose-400/20' : 'text-emerald-400 bg-emerald-400/10 border-emerald-400/20';
                            const icon = isMissing
                                ? `<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`
                                : `<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
                            return `<li class="flex items-center justify-between py-2 border-b border-gray-700/50 last:border-0">
                                        <span class="text-gray-300">${ing.name}</span>
                                        <span class="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded border ${statusColor}">
                                            ${icon} ${ing.status}
                                        </span>
                                    </li>`;
                        }).join('');

                        const instructionsList = meal.instructions.map((inst, i) => `
                            <li class="flex gap-3 text-gray-300 items-start">
                                <span class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-gray-800 border border-gray-600 text-xs font-bold text-gray-400 mt-0.5">${i + 1}</span>
                                <span class="leading-relaxed pt-0.5">${inst}</span>
                            </li>
                        `).join('');

                        const cardHTML = `
                            <div class="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden mt-4 shadow-xl">
                                <div class="bg-gray-800 border-b border-gray-700 p-4">
                                    <h3 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                                        🍽️ Menu Option ${index + 1}
                                    </h3>
                                    <div class="flex gap-4 mt-2 text-xs font-medium text-gray-400">
                                        <span class="flex items-center gap-1 bg-gray-900 px-2 py-1 rounded-md border border-gray-700">⏱️ ${meal.cooking_time}</span>
                                        <span class="flex items-center gap-1 bg-gray-900 px-2 py-1 rounded-md border border-gray-700">👥 Serves ${meal.number_of_individuals}</span>
                                    </div>
                                </div>
                                <div class="p-5">
                                    <h4 class="text-xs font-bold tracking-wider text-gray-500 uppercase mb-3">Ingredients</h4>
                                    <ul class="mb-6">${ingredientsList}</ul>
                                    <h4 class="text-xs font-bold tracking-wider text-gray-500 uppercase mb-3">Preparation</h4>
                                    <ul class="space-y-4">${instructionsList}</ul>
                                </div>
                            </div>
                        `;
                        appendHTMLToChat('chef', cardHTML);
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById(loadingId)?.remove();
                appendHTMLToChat('chef', '<span class="text-rose-400">System error: Unable to reach the kitchen.</span>');
            }
        }

        // Improved DOM Injection
        function appendHTMLToChat(sender, htmlContent, customId = null) {
            const isUser = sender === 'user';

            // Chef Avatar (only show for chef messages)
            const avatarHtml = isUser ? '' : `
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center flex-shrink-0 mt-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-white">
                        <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                        <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
                    </svg>
                </div>
            `;

            const alignment = isUser ? 'ml-auto' : 'mr-auto';
            const bgClass = isUser ? 'bg-blue-600 text-white' : 'bg-gray-800 border border-gray-700 text-gray-200';
            const radius = isUser ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';
            const wrapperId = customId ? `id="${customId}"` : '';

            const structure = `
                <div ${wrapperId} class="flex items-start gap-3 ${alignment} max-w-[85%]">
                    ${avatarHtml}
                    <div class="${bgClass} px-5 py-3 ${radius} shadow-sm w-full">
                        ${htmlContent}
                    </div>
                </div>
            `;

            chatBox.insertAdjacentHTML('beforeend', structure);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Event Listeners
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
